spring:
  application:
    name: support-ticket-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # File-mode H2 so data survives restarts. PostgreSQL mode keeps the SQL portable.
    url: jdbc:h2:file:./data/tickets;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    # No default: the password must be supplied through the environment.
    password: ${TICKETS_DB_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  compression:
    enabled: true
    min-response-size: 1024

springdoc:
  swagger-ui:
    path: /swagger-ui.html
