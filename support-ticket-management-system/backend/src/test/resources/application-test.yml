spring:
  datasource:
    # Unique in-memory database per Spring context; Flyway builds the real schema.
    url: jdbc:h2:mem:tickets-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
